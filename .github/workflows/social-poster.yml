name: Post weekly cheapest fuel prices to Facebook

on:
  schedule:
    # Monday and Thursday, 22:00 UTC = 08:00/09:00 AEST/AEDT (Sydney) next day
    - cron: '0 22 * * 1,4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the post but do not publish it to Facebook'
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social-poster
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: social-poster/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch prices and post to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node index.mjs
