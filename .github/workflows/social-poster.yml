name: Post cheapest fuel prices to Facebook

on:
  schedule:
    # Monday 22:00 UTC (Tuesday morning in Sydney): capital cities, petrol + diesel
    - cron: '0 22 * * 1'
    # Thursday 22:00 UTC (Friday 08:00 in Brisbane): Brisbane / SE Queensland weekend post
    - cron: '0 22 * * 4'
  workflow_dispatch:
    inputs:
      post_type:
        description: 'Which post to build'
        type: choice
        options:
          - capitals
          - seq
        default: capitals
      dry_run:
        description: 'Build the post but do not publish it to Facebook'
        type: boolean
        default: true

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social-poster
    env:
      POST_TYPE: ${{ github.event.inputs.post_type || (github.event.schedule == '0 22 * * 4' && 'seq') || 'capitals' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: social-poster/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Posting needs two repository secrets that only the page owner can
      # create (see social-poster/README.md). Fail fast with a clear message
      # instead of a confusing error half-way through.
      - name: Check Facebook credentials are configured
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          if [ -z "$FB_PAGE_ID" ] || [ -z "$FB_PAGE_ACCESS_TOKEN" ]; then
            echo "::error title=Facebook secrets missing::Add FB_PAGE_ID and FB_PAGE_ACCESS_TOKEN under Settings > Secrets and variables > Actions (see social-poster/README.md)."
            exit 1
          fi

      - name: Fetch prices and post to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node index.mjs
