name: Refresh City Stats

# Fetches a real, live snapshot of fuel prices and EV charger counts for
# each city page and commits it to src/data/cityStats.json.
#
# Disabled (schedule removed): the templated city pages this data fed
# were removed from the site (see the "remove templated city pages"
# commit), so cityStats.json no longer has a consumer. Left as
# workflow_dispatch-only rather than deleted, in case city pages come
# back in some form later.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch live city stats
        run: node scripts/fetch-city-stats.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/cityStats.json; then
            echo "No change in city stats — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/cityStats.json
          git commit -m "chore: refresh live city stats snapshot"
          git push
