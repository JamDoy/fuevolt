name: Build and Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and verify production app
        run: npm run build

      - name: Upload verified production artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuevolt-public-html
          path: ./dist
          include-hidden-files: true

      - name: Publish verified artifact to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true

      - name: Verify deploy branch artifact
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-output"
          git fetch origin deploy
          git archive origin/deploy | tar -x -C "$RUNNER_TEMP/deploy-output"
          node scripts/verify-prerender.js "$RUNNER_TEMP/deploy-output"

      # Written here — after the public build artifact and deploy branch are
      # already published — so this credential never appears in either of
      # those, only transiently on the runner for the FTP step below. Pure
      # bash/sed, deliberately no dependency on PHP being present on the
      # *runner* (it only needs to exist on Hostinger's side) — a previous
      # version of this step used `php -r` and silently produced no file at
      # all, most likely because PHP isn't actually on this runner image.
      - name: Write NT API credentials (server-side only, never committed)
        env:
          NT_API_USERNAME: ${{ secrets.NT_API_USERNAME }}
          NT_API_PASSWORD: ${{ secrets.NT_API_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist/api

          # Escapes a value for safe use inside a PHP single-quoted string:
          # backslash first (\ -> \\), then single quote (' -> \'). Order
          # matters — escaping quotes first would corrupt the backslashes
          # introduced by that step if a value ever contained both.
          php_single_quote_escape() {
            printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e "s/'/\\\\'/g"
          }

          esc_user=$(php_single_quote_escape "$NT_API_USERNAME")
          esc_pass=$(php_single_quote_escape "$NT_API_PASSWORD")

          {
            echo '<?php'
            echo "define('NT_API_USERNAME', '${esc_user}');"
            echo "define('NT_API_PASSWORD', '${esc_pass}');"
          } > dist/api/nt-config.php

          echo "Wrote dist/api/nt-config.php ($(wc -c < dist/api/nt-config.php) bytes)"
          test -s dist/api/nt-config.php

      - name: Deploy complete artifact to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 5.183.10.103
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
      - name: Verify live Hostinger guide pages
        continue-on-error: true
        run: npm run verify:live

      - name: Notify IndexNow
        continue-on-error: true
        run: node scripts/ping-indexnow.js
